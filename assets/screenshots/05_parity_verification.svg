<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="100%" height="100%">
  <defs>
    <linearGradient id="pv-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1e2e"/>
      <stop offset="100%" stop-color="#11111b"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Container -->
  <rect x="15" y="15" width="870" height="410" rx="12" fill="url(#pv-grad)" stroke="#313244" stroke-width="1.5" filter="url(#shadow)"/>

  <!-- Titlebar -->
  <path d="M 15 27 A 12 12 0 0 1 27 15 L 873 15 A 12 12 0 0 1 885 27 L 885 52 L 15 52 Z" fill="#181825"/>
  <circle cx="38" cy="34" r="6.5" fill="#f38ba8"/>
  <circle cx="58" cy="34" r="6.5" fill="#f9e2af"/>
  <circle cx="78" cy="34" r="6.5" fill="#a6e3a1"/>
  <text x="450" y="38" text-anchor="middle" fill="#cdd6f4" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Stage 7 Parity Verification: Golden Master &amp; Traffic Shadowing Shield</text>

  <!-- Incoming Traffic Gateway -->
  <g transform="translate(45, 80)">
    <rect width="180" height="120" rx="8" fill="#181825" stroke="#89b4fa" stroke-width="1.5"/>
    <text x="20" y="30" fill="#89b4fa" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">🌐 Inbound Traffic</text>
    <text x="20" y="55" fill="#a6adc8" font-family="ui-monospace, monospace" font-size="11">• HTTP / gRPC calls</text>
    <text x="20" y="75" fill="#a6adc8" font-family="ui-monospace, monospace" font-size="11">• Synthetic Replay</text>
    <text x="20" y="95" fill="#a6adc8" font-family="ui-monospace, monospace" font-size="11">• Golden Master Fixtures</text>
  </g>

  <!-- Splitter / Scientist Pattern -->
  <path d="M 225 140 L 300 140" stroke="#cdd6f4" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="262" y="130" text-anchor="middle" fill="#f9e2af" font-family="ui-monospace, monospace" font-size="10">FORK</text>

  <!-- Legacy Monolith (Baseline) -->
  <g transform="translate(305, 70)">
    <rect width="250" height="65" rx="6" fill="#181825" stroke="#6c7086" stroke-width="1.2"/>
    <text x="15" y="25" fill="#cdd6f4" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">🏛️ Legacy Baseline (Java 8 / WildFly)</text>
    <text x="15" y="48" fill="#a6e3a1" font-family="ui-monospace, monospace" font-size="11">Active: Real Mutating Writes &amp; DB</text>
  </g>

  <!-- Modernized Service (Shadow) -->
  <g transform="translate(305, 150)">
    <rect width="250" height="65" rx="6" fill="#181825" stroke="#a6e3a1" stroke-width="1.5"/>
    <text x="15" y="25" fill="#a6e3a1" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">⚡ Modernized (Spring Boot 3 / Java 21)</text>
    <text x="15" y="48" fill="#89dceb" font-family="ui-monospace, monospace" font-size="11">Shadow Run: Zero Production Side Effects</text>
  </g>

  <!-- Shield Boundary Box -->
  <g transform="translate(585, 65)">
    <rect width="270" height="155" rx="8" fill="#181825" stroke="#f38ba8" stroke-width="1.5" stroke-dasharray="4"/>
    <text x="20" y="28" fill="#f38ba8" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">🛡️ Test Double / Spy Safety Shield</text>
    <text x="20" y="50" fill="#6c7086" font-family="system-ui, sans-serif" font-size="10">Guards external mutation boundaries:</text>
    
    <text x="20" y="75" fill="#f9e2af" font-family="ui-monospace, monospace" font-size="11">🚫 Payment Gateway (Stripe / Adyen)</text>
    <text x="20" y="98" fill="#f9e2af" font-family="ui-monospace, monospace" font-size="11">🚫 Downstream Outbound Mailer</text>
    <text x="20" y="121" fill="#f9e2af" font-family="ui-monospace, monospace" font-size="11">🚫 External Third-Party Webhooks</text>
    <text x="20" y="142" fill="#a6e3a1" font-family="system-ui, sans-serif" font-size="10" font-weight="bold">✔ Double-spend &amp; duplicate mail protected</text>
  </g>

  <!-- Discrepancy Diffing Engine -->
  <g transform="translate(45, 240)">
    <rect width="810" height="165" rx="8" fill="#181825" stroke="#313244" stroke-width="1"/>
    <text x="25" y="30" fill="#cba6f7" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">🔬 @runtime-parity-verifier (Diff Engine &amp; Tolerance Masking)</text>
    
    <g font-family="ui-monospace, monospace" font-size="11" fill="#cdd6f4">
      <text x="25" y="60">1. Masks non-deterministic fields: timestamps, UUIDv4 tokens, traceparent headers.</text>
      <text x="25" y="82">2. Validates JSON payload schema compatibility, HTTP status codes, and latency budgets.</text>
      <text x="25" y="104" fill="#a6e3a1">3. Automated Characterization: 420 requests replayed | 0 breaking discrepancies found.</text>
      <text x="25" y="126" fill="#f9e2af">4. Emits detailed verification log to: docs/parity_discrepancies.md</text>
      <text x="25" y="148" fill="#89dceb">✔ 100% Behavioral Parity Guaranteed prior to Stage 9 PR Delivery.</text>
    </g>
  </g>
</svg>
